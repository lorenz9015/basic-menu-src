name: Offline-Diagnose bauen und prüfen
on:
  push:
    branches: [qa/firmware-13.60]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prüfwerkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-19 lld-19 g++ python3.12-venv
          python3.12 -m venv "$RUNNER_TEMP/diagnose-venv"
          "$RUNNER_TEMP/diagnose-venv/bin/pip" install --only-binary=:all: --require-hashes -r tests/browser-requirements.txt
          echo "$RUNNER_TEMP/diagnose-venv/bin" >> "$GITHUB_PATH"
      - name: C++, Sanitizer, WebAssembly und Browser testen
        run: tools/check.sh
      - name: ZIP zweimal bauen und Prüfsummen kontrollieren
        run: |
          python3 tools/package.py
          python3 tools/build.py --out "$RUNNER_TEMP/rebuild"
          python3 tools/package.py --build-dir "$RUNNER_TEMP/rebuild"
          cmp build/basic-menu-diagnose-13.60.zip "$RUNNER_TEMP/rebuild/basic-menu-diagnose-13.60.zip"
          (cd build && sha256sum -c basic-menu-diagnose-13.60.zip.sha256)
          unzip -q build/basic-menu-diagnose-13.60.zip -d "$RUNNER_TEMP/checked"
          (cd "$RUNNER_TEMP/checked" && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: basic-menu-hostdiagnose
          path: |
            build/basic-menu-diagnose-13.60.zip
            build/basic-menu-diagnose-13.60.zip.sha256
          if-no-files-found: error
